<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos · Calamares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f8f8; --surface:#ffffff; --ink:#0b2a3a; --muted:#557282; --line:#d5e4e7;
  --sea:#0a8f95; --hero-a:#0b3b52; --hero-b:#0a8f95; --hero-fg:#f4fbfb;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#071a24;--surface:#0d2633;--ink:#e6f3f4;--muted:#8fb0bb;--line:#1c3b4a;--sea:#3cc6c9;--hero-a:#05202e;--hero-b:#0a6f78;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:flex;align-items:center;gap:6px;text-decoration:none;color:inherit}
.brand{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.tabs{max-width:820px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.tabs button{all:unset;cursor:pointer;text-align:center;font-weight:600;font-size:15px;padding:9px;border-radius:999px;color:var(--hero-fg)}
.tabs button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero-a)}
.tabs button:focus-visible{outline:2px solid var(--hero-fg);outline-offset:2px}
main{max-width:820px;margin:0 auto;padding-inline:12px;padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
main img{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;background:var(--line);cursor:zoom-in}
.cta{display:block;text-align:center;margin-top:10px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--sea);font-weight:600;text-decoration:none}
.lb{position:fixed;inset:0;z-index:20;background:#04121a;display:flex;align-items:center;justify-content:center;overflow:auto}
.lb img{width:100%;height:auto;max-height:100vh;object-fit:contain}
.lb button{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;all:unset;cursor:pointer;color:#fff;font-size:26px;padding:8px 12px;background:rgba(0,0,0,.4);border-radius:999px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="back" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg><span class="brand">Calamares</span></a>
  </div>
  <div class="tabs" role="group">
    <button id="t-pratos" data-t="pratos" aria-pressed="true">Pratos</button>
    <button id="t-drinks" data-t="drinks" aria-pressed="false">Drinks</button>
  </div>
</header>
<main id="g"></main>
<div class="lb" id="lb" hidden><button id="lbx" aria-label="Fechar">✕</button><img id="lbi" alt=""></div>
<script>
/* Para trocar fotos: substitua os arquivos na pasta fotos/ mantendo os nomes. Para adicionar, aumente o número abaixo. */
const QTD = { pratos: 14, drinks: 7 };
const T = {
  pt:{pratos:"Pratos", drinks:"Drinks", menu:"Ver cardápio com preços"},
  en:{pratos:"Dishes", drinks:"Drinks", menu:"See full menu with prices"},
  es:{pratos:"Platos", drinks:"Tragos", menu:"Ver menú con precios"}
};
let lang = new URLSearchParams(location.search).get("lang");
if (!T[lang]) { try { lang = localStorage.getItem("calamares-lang"); } catch(e) { lang = null; } }
if (!T[lang]) { const n = (navigator.language || "pt").slice(0,2); lang = T[n] ? n : "pt"; }
document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
document.querySelectorAll(".tabs button").forEach(b => b.textContent = T[lang][b.dataset.t]);

const g = document.getElementById("g");
function show(tipo){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === tipo)));
  let h = "";
  for (let i = 1; i <= QTD[tipo]; i++){
    const f = `fotos/${tipo}-${String(i).padStart(2,"0")}.jpg`;
    h += `<img src="${f}" alt="" ${i > 2 ? 'loading="lazy"' : ''}>`;
  }
  h += `<a class="cta" href="cardapio.html?lang=${lang}${tipo === "drinks" ? "#drinks" : ""}">${T[lang].menu}</a>`;
  g.innerHTML = h;
  history.replaceState(null, "", "#" + tipo);
  scrollTo(0, 0);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.t)));
const lb = document.getElementById("lb");
g.addEventListener("click", e => { if (e.target.tagName === "IMG"){ document.getElementById("lbi").src = e.target.src; lb.hidden = false; } });
lb.addEventListener("click", () => lb.hidden = true);
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });
show(location.hash === "#drinks" ? "drinks" : "pratos");
</script>
</body>
</html>
