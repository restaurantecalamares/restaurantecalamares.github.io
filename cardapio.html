*{box-sizing:border-box}
html{scroll-padding-top:120px}

a{color:inherit}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}

.brand{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}

.lang button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero-a);opacity:1}
.lang button:focus-visible{outline:2px solid var(--hero-fg);outline-offset:2px}
.chips{max-width:720px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.chips a.on{background:var(--hero-fg);color:var(--hero-a)}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
section{padding-top:22px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.75rem;margin:0;line-height:1.1}
.sub{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);margin-top:4px}
h3{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.item+.item{border-top:1px solid var(--line)}
.txt{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:600;font-size:16px}
.price{flex:none;font-weight:600;font-size:15px;color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
.desc{font-size:14px;color:var(--muted);margin-top:3px}
.ph{flex:none;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--sea-soft);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
.lb{position:fixed;inset:0;z-index:20;background:rgba(4,16,22,.88);display:grid;place-items:center;padding:24px}
.lb img{max-width:100%;max-height:78vh;border-radius:14px}
.lb p{color:#f4fbfb;text-align:center;margin:12px 0 0;font-weight:500}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;all:unset;cursor:pointer;color:#f4fbfb;font-size:28px;line-height:1;padding:8px}
[hidden]{display:none!important}

const UI = {
  pt:{ask:"Consultar", back:"Início", close:"Fechar", note:"Preços em reais (R$). Imagens ilustrativas."},
  en:{ask:"Ask staff", back:"Home", close:"Close", note:"Prices in Brazilian reais (R$). Photos for illustration."},
  es:{ask:"Consultar", back:"Inicio", close:"Cerrar", note:"Precios en reales (R$). Imágenes ilustrativas."}
};
const LI = {pt:0, en:1, es:2};
let lang = "pt";
const fmt = p => p === "?" ? UI[lang].ask : "R$ " + p.toFixed(2).replace(".", ",");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function render(){
  const i = LI[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  document.getElementById("chips").innerHTML = MENU.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.t[i])}</a>`).join("");
  document.getElementById("menu").innerHTML = MENU.map(s => `
    <section id="${s.id}"><h2>${esc(s.t[i])}</h2>${s.id === "para2" ? "" : ""}
    ${s.groups.map(g => `${g.t ? `<h3>${esc(g.t[i])}</h3>` : ""}<div class="list" style="${g.t ? "" : "margin-top:12px"}">
      ${g.items.map(it => { const n = it[2 + i*2], d = it[3 + i*2]; return `
      <div class="item"><div class="txt"><div class="row"><span class="name">${esc(n)}</span><span class="price">${fmt(it[1])}</span></div>${d ? `<div class="desc">${esc(d)}</div>` : ""}</div>
      ${it[0] ? `<button class="ph" data-img="${it[0]}" data-name="${esc(n)}" aria-label="${esc(n)}"><img src="img/${it[0]}.jpg" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>` : ""}</div>`; }).join("")}
    </div>`).join("")}
    </section>`).join("") + `<p class="note">${UI[lang].note}</p>`;
  document.getElementById("lbx").setAttribute("aria-label", UI[lang].close);
  spy();
}

function setLang(l){
  lang = LI[l] !== undefined ? l : "pt";
  try{ localStorage.setItem("calamares-lang", lang); }catch(e){}
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  render();
}

function spy(){
  const chips = [...document.querySelectorAll("#chips a")];
  let cur = MENU[0].id;
  for (const s of MENU){ const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top < 140) cur = s.id; }
  chips.forEach(c => { const on = c.dataset.id === cur; c.classList.toggle("on", on); if (on && c.dataset.on !== "1") c.scrollIntoView({block:"nearest", inline:"center"}); c.dataset.on = on ? "1" : ""; });
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, {passive:true});

const lb = document.getElementById("lb");
document.getElementById("menu").addEventListener("click", e => {
  const b = e.target.closest(".ph"); if (!b) return;
  document.getElementById("lbi").src = "img/" + b.dataset.img + ".jpg";
  document.getElementById("lbt").textContent = b.dataset.name;
  lb.hidden = false;
});
lb.addEventListener("click", () => { lb.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));

let start = new URLSearchParams(location.search).get("lang");
if (!LI.hasOwnProperty(start)){ try{ start = localStorage.getItem("calamares-lang"); }catch(e){ start = null; } }
if (!LI.hasOwnProperty(start)){ const n = (navigator.language || "pt").slice(0,2).toLowerCase(); start = LI.hasOwnProperty(n) ? n : "pt"; }
lang = start; render();
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
